# Configuration de l'interface d'administration (Decap CMS) — /admin
# Gère : réalisations vidéo, galerie photo, bande démo.
# Les textes et les tarifs se modifient directement dans les fichiers .html
# (blocs repérés par des commentaires « MODIFIER ICI »).
backend:
  name: github
  repo: remichauvinproduction-web/siteweb
  branch: main
  base_url: https://oauth-proxy.remiproduction.workers.dev
  auth_endpoint: oauth

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

media_folder: "images"
public_folder: "/images"

collections:
  - name: realisations
    label: Réalisations vidéo
    files:
      - name: videos
        label: Liste des réalisations vidéo
        file: data/videos.json
        fields:
          - label: Réalisations
            name: items
            widget: list
            label_singular: Réalisation
            summary: '{{fields.title}} — {{fields.category}}'
            fields:
              - { label: Titre du projet, name: title, widget: string }
              - label: Catégorie
                name: category
                widget: select
                options:
                  - { label: Publicité, value: publicite }
                  - { label: Entreprise, value: entreprise }
                  - { label: Réseaux sociaux, value: reseaux }
                  - { label: Événementiel, value: evenementiel }
                  - { label: Créations personnelles / courts métrages, value: creation }
              - { label: Type de production, name: type, widget: string, required: false, hint: "Ex : Film promotionnel · Drone" }
              - { label: Client (seulement si sa mention est autorisée), name: client, widget: string, required: false }
              - { label: Courte description, name: description, widget: text, required: false }
              - { label: Mon rôle exact sur ce projet, name: role, widget: string, required: false, hint: "Ex : Tournage, montage et étalonnage" }
              - label: Format de la vidéo
                name: orientation
                widget: select
                default: "16:9"
                options: ["16:9", "9:16"]
              - { label: Lien ou ID YouTube, name: youtube, widget: string, required: false, hint: "Colle le lien YouTube (vidéo ou Short)" }
              - { label: Fichier vidéo local (alternative à YouTube), name: file, widget: string, required: false, hint: "Ex : /videos/reel-01.mp4" }
              - { label: Vignette, name: thumbnail, widget: image, required: false, hint: "Sans vignette, celle de YouTube est utilisée" }
              - { label: Mettre en avant sur l'accueil, name: featured, widget: boolean, default: false }

  - name: photos
    label: Galerie photo
    files:
      - name: gallery
        label: Photos de la galerie
        file: data/gallery.json
        fields:
          - label: Photos
            name: items
            widget: list
            label_singular: Photo
            summary: '{{fields.label}} ({{fields.category}})'
            fields:
              - { label: Image, name: image, widget: image }
              - label: Catégorie
                name: category
                widget: select
                options:
                  - { label: Portrait, value: portrait }
                  - { label: Événement, value: evenement }
                  - { label: Sport, value: sport }
                  - { label: Nature, value: nature }
              - { label: Légende affichée, name: label, widget: string }
              - { label: Texte alternatif (accessibilité et SEO), name: alt, widget: string, hint: "Décris la photo en une phrase" }

  - name: galeries_clients
    label: Galeries clients
    label_singular: Galerie client
    folder: data/galeries
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    identifier_field: title
    summary: "{{title}} — https://{{slug}}.remiproduction.fr (ou /galerie/{{slug}})"
    fields:
      - { label: Nom de la galerie, name: title, widget: string }
      - { label: Client, name: client, widget: string, required: false }
      - { label: Date de la séance, name: date, widget: string, required: false, hint: "Ex : 14 juin 2026" }
      - { label: Lieu, name: location, widget: string, required: false }
      - { label: Message d’introduction, name: description, widget: text, required: false }
      - { label: Photo de couverture, name: cover, widget: image, required: false }
      - label: Photos livrées
        name: photos
        widget: list
        label_singular: Photo
        summary: "{{fields.label}}"
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Légende, name: label, widget: string, required: false }
          - { label: Texte alternatif, name: alt, widget: string, required: false }
          - { label: Fichier HD à télécharger (facultatif), name: download, widget: string, required: false, hint: "Vide : l’image affichée est téléchargée." }

  - name: showreel
    label: Bande démo (accueil)
    files:
      - name: showreel
        label: Bande démo
        file: data/showreel.json
        fields:
          - { label: Titre, name: title, widget: string }
          - { label: Lien ou ID YouTube, name: youtube, widget: string, required: false, hint: "Renseigner ce champ pour activer la bande démo sur la page d'accueil" }
          - { label: Fichier vidéo local (alternative), name: file, widget: string, required: false }
          - { label: Image de couverture, name: poster, widget: image, required: false }
          - { label: Durée affichée, name: duree, widget: string, required: false, hint: "Ex : 1 min 20" }
